# codex-memory Codex CLI integration example
# Add the following to ~/.codex/config.toml
# Replace /path/to/codex-memory with the folder where you cloned and built this repo.

# ── Notify Hook ──
# Codex runs this command after each turn and appends the event JSON as the last argument.
# `notify` is a top-level key, so keep it above any [table] section.
notify = ["node", "/path/to/codex-memory/dist/cli.js", "notify"]

# ── MCP Server Registration ──
# Same result as: codex mcp add codex-memory -- node /path/to/codex-memory/dist/server.js
[mcp_servers.codex-memory]
command = "node"
args = ["/path/to/codex-memory/dist/server.js"]
