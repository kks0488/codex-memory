<g class="l0"><text x="28" y="74" fill="#38bdf8" font-weight="700">›</text><text x="54" y="74" fill="#f0f6fc" font-weight="700">node dist/cli.js notify &#x27;{&quot;type&quot;:&quot;agent-turn-complete&quot;,…}&#x27;</text><rect class="c0" x="52" y="52" width="920" height="30" fill="#0d1117"/></g>
