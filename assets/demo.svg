<title id="t">codex-memory terminal demo</title>
<desc id="d">A Codex turn is stored by the notify hook, a lesson is saved as a pinned memory, and the MCP tools search, timeline, get_observations and __IMPORTANT bring it back. Output captured from a real local run with a throwaway database.</desc>
